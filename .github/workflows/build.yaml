name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No generator name: CMake picks the newest Visual Studio on the runner image.
      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Download pluginval and clap-validator
        run: bash .github/scripts/fetch-validators.sh "${RUNNER_TEMP}/validators"

      # pluginval 2 embeds the VST 3 SDK validator and runs it at strictness level 5 and above.
      - name: Validate VST 3 with pluginval
        run: |
          "${RUNNER_TEMP}/validators/pluginval/pluginval.exe" validate --strictness-level 10 \
            --output-dir "${RUNNER_TEMP}/pluginval-logs" \
            "build/assets/VST3/Simple Pitch Shift.vst3"

      - name: Validate CLAP with clap-validator
        run: |
          validator=$(find "${RUNNER_TEMP}/validators/clap-validator" -name 'clap-validator.exe' | head -n 1)
          "${validator}" validate "build/assets/CLAP/Release/Simple Pitch Shift.clap"

      - name: Package
        id: package
        run: |
          version=$(sed -nE 's/^project\(simple-pitchshift-audio VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          cmake --install build --config Release --prefix dist
          bash .github/scripts/check-package.sh dist
          name="simple-pitchshift-${version}-windows-x64.zip"
          (cd dist && cmake -E tar cf "../${name}" --format=zip -- *)
          unzip -l "${name}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ steps.package.outputs.name }}
          if-no-files-found: error
    outputs:
      version: ${{ steps.package.outputs.version }}
      name: ${{ steps.package.outputs.name }}

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check that the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "Tag ${TAG} does not match version ${VERSION} in CMakeLists.txt"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: List release files
        env:
          NAME: ${{ needs.build.outputs.name }}
        run: sha256sum "${NAME}" > "${RUNNER_TEMP}/release-checksums.txt"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/release-checksums.txt

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ needs.build.outputs.name }}
        # gh release create cannot combine --notes-from-tag with --repo, and this job has no checkout,
        # so the notes are read from the annotated tag through the API.
        run: |
          read -r type sha < <(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.type + " " + .object.sha')
          if [ "${type}" != tag ]; then
            echo "${TAG} is not an annotated tag; its annotation becomes the release notes"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.message' > "${RUNNER_TEMP}/release-notes.md"
          gh release create "${TAG}" "${NAME}" --repo "${GITHUB_REPOSITORY}" --draft --verify-tag --title "${TAG}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
